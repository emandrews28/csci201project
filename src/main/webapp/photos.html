<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background: #f5f5f5;
      color: #1f2937;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.2;
    }

    header nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.95;
    }

    header a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.05rem;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.ok {
      background: #dbeafe;
      color: #1e40af;
    }

    .hidden {
      display: none;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input[type="file"] {
      display: none;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .file-label {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
    }

    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-danger {
      background: #d93b3b;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .gallery figure {
      margin: 0;
      background: #fafafa;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
    }

    .gallery figcaption {
      padding: 8px;
      font-size: 0.85rem;
    }

    .lookup-row {
      display: flex;
      gap: 10px;
      align-items: end;
    }

    .lookup-row > div {
      flex: 1;
    }

    .restaurant-search-wrap {
      position: relative;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      max-height: 220px;
      overflow-y: auto;
      z-index: 20;
    }

    .dropdown-item {
      padding: 10px 12px;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: #f3f4f6;
    }

    .empty {
      color: #6b7280;
      font-size: 0.9rem;
      padding: 8px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
    }

    .modal.open {
      display: flex;
    }
  </style>
</head>

<body>

<header>
  <h1>Restaurant Photos</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="map.html">Map</a>
    <a href="rankings.html">Rankings</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="reviews.html">Reviews</a>
    <a href="friends.html">Friends</a>
    <a href="group_rankings.html">Groups</a>
  </nav>
</header>

<main id="main-content">

  <section class="card">

    <h2>Upload a Photo</h2>

    <form id="uploadForm">

      <label for="restaurantSearch">Restaurant</label>

      <div class="restaurant-search-wrap">
        <input
          type="text"
          id="restaurantSearch"
          placeholder="Search restaurant name..."
          autocomplete="off"
          required
        />

        <div id="restaurantDropdown" class="dropdown hidden"></div>
      </div>


      <label for="caption">Caption</label>

      <textarea
        id="caption"
        name="caption"
        placeholder="Describe the photo"
      ></textarea>

      <label for="image">
        Image (JPEG, PNG, or HEIC — max 5 MB)
      </label>

      <div class="file-row">
        <label class="file-label" for="image">Choose File</label>

        <span id="fileName">No file chosen</span>

        <input
          type="file"
          id="image"
          name="image"
          accept="image/jpeg,image/png,image/heic,image/heif"
          required
        />
      </div>

      <img id="preview" class="preview" alt="Preview" />

      <div class="actions">
        <button type="submit" class="btn-primary">
          Upload
        </button>

        <button type="button" class="btn-secondary" id="clearBtn">
          Clear
        </button>
      </div>

      <div id="uploadStatus" class="status"></div>

    </form>
  </section>

  <section class="card">

    <h2>Restaurant Gallery</h2>

    <div class="lookup-row">

      <div class="restaurant-search-wrap">

        <label for="restaurantLookupSearch">Restaurant</label>

        <input
          type="text"
          id="restaurantLookupSearch"
          placeholder="Search restaurant name..."
          autocomplete="off"
        />

        <div id="restaurantLookupDropdown" class="dropdown hidden"></div>

      </div>

      <button
        type="button"
        class="btn-primary"
        id="loadRestaurantBtn"
      >
        Load
      </button>

    </div>

    <div id="restaurantGallery" class="gallery"></div>

  </section>

  <section class="card">

    <div class="section-header">
      <h2>My Photos</h2>

      <button
        type="button"
        class="btn-primary"
        id="loadUserBtn"
      >
        Refresh
      </button>
    </div>

    <p id="myPhotosStatus" class="empty">
      Loading your photos…
    </p>

    <div id="userGallery" class="gallery"></div>

  </section>

</main>

<div id="modal" class="modal" onclick="this.classList.remove('open')">
  <img id="modalImg" alt="" />
</div>

<script>

let currentUserId = null;

async function loadSession() {

  try {

    const res = await fetch('api/session', {
      credentials: 'include'
    });

    if (res.status === 401 || !res.ok) {

      document.getElementById("main-content").innerHTML = `
        <div class="status error">
          You must be logged in to view your photos.
        </div>
      `;

      return;
    }

    const data = await res.json();

    currentUserId = data.userId || null;

    if (!currentUserId) {

      document.getElementById("main-content").innerHTML = `
        <div class="status error">
          You must be logged in to view your photos.
        </div>
      `;

      return;
    }

    loadMyPhotos();

  } catch (err) {

    console.error(err);

    document.getElementById("main-content").innerHTML = `
      <div class="status error">
        Failed to load photos.
      </div>
    `;
  }
}

async function loadMyPhotos() {
	  const status = document.getElementById("myPhotosStatus");
	  const gallery = document.getElementById("userGallery");

	  if (!currentUserId) {
	    status.textContent = "Log in to view your photos.";
	    gallery.innerHTML = "";
	    return;
	  }

	  status.textContent = "Loading your photos...";
	  gallery.innerHTML = "";

	  try {
	    const res = await fetch("api/photos?userId=" + encodeURIComponent(currentUserId), {
	      credentials: "include"
	    });

	    if (!res.ok) {
	      status.textContent = "Could not load your photos. Status: " + res.status;
	      return;
	    }

	    const photos = await res.json();

	    if (!photos || photos.length === 0) {
	      status.textContent = "No photos yet.";
	      return;
	    }

	    status.textContent = "";
	    gallery.innerHTML = "";

	    photos.forEach(p => {
	      const fig = document.createElement("figure");

	      fig.innerHTML = `
	        <img src="${p.imageUrl}" alt="${p.caption || 'Photo'}">
	        <figcaption>
	          <strong>${p.restaurantName || 'Restaurant'}</strong><br>
	          ${p.caption || ''}
	        </figcaption>
	      `;

	      gallery.appendChild(fig);
	    });

	  } catch (err) {
	    console.error(err);
	    status.textContent = "Error loading your photos.";
	  }
	}
const restaurantSearch = document.getElementById('restaurantSearch');
const restaurantDropdown = document.getElementById('restaurantDropdown');

let selectedRestaurantId = null;
let restaurantSearchTimer = null;

restaurantSearch.addEventListener('input', () => {

  selectedRestaurantId = null;

  clearTimeout(restaurantSearchTimer);

  restaurantSearchTimer = setTimeout(searchRestaurants, 250);
});

async function searchRestaurants() {

  const query = restaurantSearch.value.trim();

  if (query.length < 2) {

    restaurantDropdown.innerHTML = '';
    restaurantDropdown.classList.add('hidden');
    return;
  }

  try {

    const res = await fetch(
      'api/restaurants/search?q=' + encodeURIComponent(query),
      {
        credentials: 'include'
      }
    );

    const restaurants = await res.json();

    restaurantDropdown.innerHTML = '';

    if (!restaurants || restaurants.length === 0) {

      restaurantDropdown.innerHTML =
        '<div class="dropdown-item">No restaurants found.</div>';

      restaurantDropdown.classList.remove('hidden');

      return;
    }

    restaurants.forEach((restaurant) => {

      const item = document.createElement('div');

      item.className = 'dropdown-item';

      item.innerHTML = `
        <div><strong>${restaurant.name}</strong></div>
        <div style="font-size: 0.85rem; color: gray;">
          ${restaurant.address || ''}
        </div>
      `;

      item.addEventListener('click', () => {

        selectedRestaurantId = restaurant.restaurantId;

        restaurantSearch.value = restaurant.name;

        restaurantDropdown.classList.add('hidden');
      });

      restaurantDropdown.appendChild(item);
    });

    restaurantDropdown.classList.remove('hidden');

  } catch (err) {

    restaurantDropdown.innerHTML =
      '<div class="dropdown-item">Search failed.</div>';

    restaurantDropdown.classList.remove('hidden');
  }
}

document.addEventListener('click', (event) => {

  if (
    !restaurantDropdown.contains(event.target) &&
    event.target !== restaurantSearch
  ) {
    restaurantDropdown.classList.add('hidden');
  }
});
const uploadForm = document.getElementById('uploadForm');
const imageInput = document.getElementById('image');
const fileName = document.getElementById('fileName');
const preview = document.getElementById('preview');
const clearBtn = document.getElementById('clearBtn');
const uploadStatus = document.getElementById('uploadStatus');

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];

  if (!file) {
    fileName.textContent = 'No file chosen';
    preview.style.display = 'none';
    return;
  }

  fileName.textContent = file.name;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
});

clearBtn.addEventListener('click', () => {

	  uploadForm.reset();

	  fileName.textContent = 'No file chosen';

	  preview.style.display = 'none';

	  selectedRestaurantId = null;

	  uploadStatus.textContent = '';

	  uploadStatus.className = 'status';
	});

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const file = imageInput.files[0];

  if (!selectedRestaurantId) {
    uploadStatus.className = 'status error';
    uploadStatus.textContent = 'Please select a restaurant.';
    return;
  }

  if (!file) {
    uploadStatus.className = 'status error';
    uploadStatus.textContent = 'Please choose an image file.';
    return;
  }

  const url = new URL('api/photos', window.location.href);
  url.searchParams.set('restaurantId', selectedRestaurantId);


  const caption = document.getElementById('caption').value;


  if (caption) url.searchParams.set('caption', caption);

  const formData = new FormData();
  formData.append('image', file);

  const res = await fetch(url, {
    method: 'POST',
    credentials: 'include',
    body: formData
  });

  if (!res.ok) {
    uploadStatus.className = 'status error';
    uploadStatus.textContent = 'Upload failed.';
    return;
  }

  uploadStatus.className = 'status ok';
  uploadStatus.textContent = 'Photo uploaded successfully.';
  loadMyPhotos();
});
const restaurantLookupSearch = document.getElementById('restaurantLookupSearch');
const restaurantLookupDropdown = document.getElementById('restaurantLookupDropdown');
const loadRestaurantBtn = document.getElementById('loadRestaurantBtn');

let selectedLookupRestaurantId = null;
let restaurantLookupTimer = null;

restaurantLookupSearch.addEventListener('input', () => {

  selectedLookupRestaurantId = null;

  clearTimeout(restaurantLookupTimer);

  restaurantLookupTimer = setTimeout(searchLookupRestaurants, 250);
});

async function searchLookupRestaurants() {

  const query = restaurantLookupSearch.value.trim();

  if (query.length < 2) {

    restaurantLookupDropdown.innerHTML = '';
    restaurantLookupDropdown.classList.add('hidden');

    return;
  }

  const res = await fetch(
    'api/restaurants/search?q=' + encodeURIComponent(query),
    {
      credentials: 'include'
    }
  );

  const restaurants = await res.json();

  restaurantLookupDropdown.innerHTML = '';

  if (!restaurants || restaurants.length === 0) {

    restaurantLookupDropdown.innerHTML =
      '<div class="dropdown-item">No restaurants found.</div>';

    restaurantLookupDropdown.classList.remove('hidden');

    return;
  }

  restaurants.forEach((restaurant) => {

    const item = document.createElement('div');

    item.className = 'dropdown-item';

    item.innerHTML = `
      <div><strong>${restaurant.name}</strong></div>
      <div style="font-size: 0.85rem; color: gray;">
        ${restaurant.address || ''}
      </div>
    `;

    item.addEventListener('click', () => {

      selectedLookupRestaurantId = restaurant.restaurantId;

      restaurantLookupSearch.value = restaurant.name;

      restaurantLookupDropdown.classList.add('hidden');

      loadRestaurantGallery();
    });

    restaurantLookupDropdown.appendChild(item);
  });

  restaurantLookupDropdown.classList.remove('hidden');
}

loadRestaurantBtn.addEventListener('click', loadRestaurantGallery);

async function loadRestaurantGallery() {

  const gallery = document.getElementById('restaurantGallery');

  if (!selectedLookupRestaurantId) {

    gallery.innerHTML =
      '<p class="empty">Please select a restaurant.</p>';

    return;
  }

  gallery.innerHTML =
    '<p class="empty">Loading...</p>';

  const res = await fetch(
    'api/photos?restaurantId=' + selectedLookupRestaurantId,
    {
      credentials: 'include'
    }
  );

  if (!res.ok) {

    gallery.innerHTML =
      '<p class="empty">Could not load photos.</p>';

    return;
  }

  const photos = await res.json();

  if (!photos || photos.length === 0) {

    gallery.innerHTML =
      '<p class="empty">No photos for this restaurant yet.</p>';

    return;
  }

  gallery.innerHTML = '';

  photos.forEach((p) => {

    const fig = document.createElement('figure');

    fig.innerHTML = `
      <img src="${p.imageUrl}" alt="${p.caption || 'Photo'}">
      <figcaption>
        <strong>${p.username || 'User'}</strong><br>
        ${p.caption || ''}
      </figcaption>
    `;

    gallery.appendChild(fig);
  });
}
loadSession();

</script>

</body>
</html>
